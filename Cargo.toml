[package]
name = "rts-analyzer"
version = "0.1.0"
edition = "2021"
default-run = "rts-analyzer"

[[bin]]
name = "rts-analyzer"
path = "src/main.rs"

[dependencies]

image = "0.25"
imageproc = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = "0.4"
aoe2rec = { path = "../aoe2rec-src/crates/aoe2rec" }


binrw = "0.15.0"
minijinja = "1.0"
open = "5.0"
include_dir = "0.7"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
