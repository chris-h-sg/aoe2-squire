[package]
name = "aoe2-squire"
version = "0.1.2"
edition = "2021"
license = "MIT"
default-run = "aoe2-squire"

[[bin]]
name = "aoe2-squire"
path = "src/main.rs"

[features]
# Developer tools that never ship in release builds: --record-video (src/capture/video.rs).
dev-tools = ["windows/Win32_System_JobObjects", "windows/Win32_Security"]

[dependencies]
ureq = { version = "2.9", features = ["json"] }
ctrlc = "3.4"

image = "0.25"
imageproc = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = "0.4"
aoe2rec = { git = "https://github.com/chris-h-sg/aoe2rec", rev = "01953a681b3b4330a66a3260569b7eb51d2e0467" }


binrw = "0.15.0"
minijinja = "1.0"
open = "5.0"
include_dir = "0.7"
rfd = "0.17.2"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
] }

[profile.dev]
# Smaller build folders per worktree; backtraces keep line numbers, but a debugger can't show local variables (set `debug = true` locally if needed).
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
